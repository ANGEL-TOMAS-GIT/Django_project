services:
  app:
    container_name: warehouse_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [ '/app/entrypoint.sh' ]
    command: >
      sh -c "
              python manage.py migrate &&
              gunicorn warehouse.wsgi:application --bind 0.0.0.0:8001 --workers 3
            "
    environment:
      RESTORE_DUMP: false
      DUMP_FILE: ./sqlite_dump.json
    expose:
      - "8001"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - warehouse_network


  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - warehouse_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - warehouse_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A warehouse beat --loglevel=info --uid=nobody
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - warehouse_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
         celery -A warehouse worker --loglevel=info --uid=nobody
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - warehouse_network


  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A warehouse flower --port=5555
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5556:5556"
    networks:
      - warehouse_network

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs/:/etc/nginx/certs
      - ./static:/code/static
    depends_on:
      - app
    networks:
      - warehouse_network

  openssl:
    image: alpine/openssl
    volumes:
      - ./certs:/certs
    command: >
      req -x509 -nodes -newkey rsa:4096 -keyout /certs/cert.key
      -out /certs/cert.crt -days 365
      -subj "/C=GE/ST=Cologne/L=Cologne/O=Course/OU=Lecture/CN=-localhost"

volumes:
  redis_data:
  static_volume:
  media_volume:

networks:
  warehouse_network:
    driver: bridge