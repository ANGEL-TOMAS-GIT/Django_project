services:
  app:
    container_name: django_books_web_psql
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [ '/app/entrypoint.sh' ]
    command: >
      sh -c "
              python manage.py migrate &&
              gunicorn django_project.wsgi:application --bind 0.0.0.0:8000 --workers 3
            "
    environment:
      DB_TYPE: postgres
      RESTORE_DUMP: true
      DUMP_FILE: ./sqlite_dump.json
    env_file:
      - .env
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - course_net
