{% extends "base.html" %}

{% block title %}Checkout{% endblock %}

{% block content %}

<h2>🧾 Checkout</h2>

<form method="post" class="checkout-form">
    {% csrf_token %}

    {% for field in form %}
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
            <div style="color:red;">{{ field.errors }}</div>
        {% endif %}
    {% endfor %}

    <button type="submit">💳 Place Order</button>
</form>

{% endblock %}
