{% extends "base.html" %}

{% block title %}Success{% endblock %}

{% block content %}

<div class="success-box">

    <h2>✅ Order Completed!</h2>

    <p>Your order ID: <strong>#{{ order.id }}</strong></p>

    <p>Total Paid: ${{ order.total_price }}</p>

    <p>
        Status:
        <span class="status-badge">
            {{ order.get_status_display }}
        </span>
    </p>

    <a href="{% url 'books' %}">
        Continue Shopping
    </a>

</div>

{% endblock %}
