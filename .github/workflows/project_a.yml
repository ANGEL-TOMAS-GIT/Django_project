name: Pipelines for Django_project project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 projectA/django_project/payments \
          projectA/django_project/books \
          projectA/django_project/custom_user_account \
          --exclude=migrations \
          --max-line-length=120

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projectA/django_project/requirements.txt

      - name: Run migrations
        run: python projectA/django_project/manage.py migrate
        env:
          ENABLE_SENTRY: false
          DJANGO_SETTINGS_MODULE: django_project.settings
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Run tests
        run: python projectA/django_project/manage.py test books

        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Run tests with coverage
        run: |
          cd projectA/django_project
          pytest \
            --cov=books \
            --cov=payments \
            --cov=custom_user_account \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit projectA/django_project/books -r -f json -o bandit-books.json || true
          bandit projectA/django_project/custom_user_account -r -f json -o bandit-custom_user_account.json || true
          bandit projectA/django_project/payment -r -f json -o bandit-payment.json || true

      - name: Upload bandit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-*.json



  docker:
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: projectB/warehouse
          load: true
          tags: warehouse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm warehouse:latest python manage.py check