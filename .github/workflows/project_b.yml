# .github/workflows/ci-cd-projectB.yml
name: Pipelines for ProjectB Warehouse

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 projectB/warehouse/accounts \
          projectB/warehouse/inventory \
          projectB/warehouse/analytics \
          --exclude=migrations \
          --max-line-length=120

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projectB/warehouse/requirements.txt
          pip install coverage

      - name: Run migrations
        run: python projectB/warehouse/manage.py migrate
        env:
          DB_TYPE: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Create groups
        run: python projectB/warehouse/manage.py create_groups
        env:
          DB_TYPE: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Run tests with coverage
        run: |
          coverage run projectB/warehouse/manage.py test accounts inventory analytics
          coverage report --fail-under=70
        env:
          DB_TYPE: postgres
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          GITHUB_ACTIONS: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit projectB/warehouse/accounts -r -f json -o bandit-accounts.json || true
          bandit projectB/warehouse/inventory -r -f json -o bandit-inventory.json || true
          bandit projectB/warehouse/analytics -r -f json -o bandit-analytics.json || true

      - name: Upload bandit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-*.json

