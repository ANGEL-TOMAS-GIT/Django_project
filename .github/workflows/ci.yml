name: Pipelines for Django_project project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 django_project/payments \
          django_project/books \
          django_project/custom_user_account \
          --exclude=migrations \
          --max-line-length=120

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: django_project/requirements.txt

      - name: Clean pip cache and force reinstall
        run: |
          pip cache purge
          pip uninstall -y redis || true
          pip uninstall -y sentry-sdk || true

      - name: Install redis first (modern version)
        run: |
          pip install --no-cache-dir --force-reinstall 'redis>=5.0.0'

      - name: Install other dependencies
        run: |
          pip install --no-cache-dir -r django_project/requirements.txt

      - name: Verify redis version
        run: |
          python -c "import redis; print(f'Redis version: {redis.__version__}')"

      - name: Run migrations
        run: python django_project/manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Run tests
        run: python django_project/manage.py test books
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432