name: Pipelines for Django_project project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # ✅ v4, no v6

      - name: Setup Python
        uses: actions/setup-python@v5  # ✅ v5, no v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          cd course/homeworks/projects/django_project  # ✅ Cambiar al directorio correcto
          flake8 payments books custom_user_account \
            --exclude=migrations \
            --max-line-length=120

  test:
    runs-on: ubuntu-latest
    needs: lint  # ✅ Esperar a que lint pase
    services:
      postgres:
        image: postgres:16-alpine  # ✅ Versión específica
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd course/homeworks/projects/django_project  # ✅ Cambiar al directorio correcto
          pip install -r requirements.txt
          pip install psycopg2-binary  # ✅ Necesario para PostgreSQL

      - name: Run migrations
        run: |
          cd course/homeworks/projects/django_project
          python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Run tests
        run: |
          cd course/homeworks/projects/django_project
          python manage.py test books --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: django_project.settings
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432